# The checks a PR must not break: the suites of tools/test-all.sh that run on Linux. usage-watcher-install is left out
# on purpose: it needs macOS (launchd, plutil and its own Darwin gate), so run it by hand on a Mac. No secrets and
# read-only. The claude CLI is installed from npm at an exact version and never logs in. A fork's PR runs its own copy
# of this file, so what keeps a secret or a write token from it is the repo's fork-PR settings, not this file; keep
# "Send secrets" and "Send write tokens" to fork PR workflows off. Keep this job on GitHub-hosted runners: it runs PR
# code and must never share a runner with claude-review.yml.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repo Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Install the claude CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.319
      - name: Run the test suites
        shell: bash
        env:
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: |
          bash tools/callboard/test.sh > "$RUNNER_TEMP/cb.log" 2>&1 || true
          grep -vE '^\s*(ok [0-9]+|✔)' "$RUNNER_TEMP/cb.log" | tail -n 250
          exit 1
