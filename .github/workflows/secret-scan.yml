# Secret scan: calls the org's reusable gitleaks workflow, pinned by commit SHA. Read-only, no secrets.
# A public repo, so it uses the default GitHub-hosted runner (ubuntu-latest), never a self-hosted one.
name: Secret Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Secret Scan
    uses: notitial/.github/.github/workflows/gitleaks.yml@d98d4a15b5f2b43eac6a8020e67740fb03c41522  # PR #1, 2026-11-08
